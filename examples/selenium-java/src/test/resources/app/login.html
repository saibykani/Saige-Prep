<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saige Todo - Sign in</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      A deliberately small app under test. It runs entirely from file:// with no server.
      Demo accounts (not secrets, they only exist in app.js):
        tester / Passw0rd!   -> signs in
        locked_user / Passw0rd! -> "This account is locked"
    -->
    <main class="card">
      <h1>Sign in</h1>
      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" data-testid="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password" />

        <button id="login-button" type="submit" data-testid="login-button">Sign in</button>
      </form>
      <p id="login-error" class="error" role="alert" data-testid="login-error" hidden></p>
      <p id="login-spinner" class="muted" hidden>Checking credentials...</p>
    </main>
    <script src="app.js"></script>
    <script>
      SaigeTodo.initLogin();
    </script>
  </body>
</html>
